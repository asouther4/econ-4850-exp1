<!doctype html>
<html>
  <head>
    <title>ECON 4850 - Choice Experiment 2</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
    <script src="jspsych-5.0/jspsych.js"></script>
    <script src="jspsych-5.0/plugins/jspsych-text.js"></script>
    <script src="jspsych-5.0/plugins/jspsych-single-stim.js"></script>
    <script src="jspsych-5.0/plugins/jspsych-survey-text.js"></script>
    <script src="jspsych-5.0/plugins/jspsych-survey-likert.js"></script>
    <script src="jspsych-5.0/plugins/jspsych-similarity.js"></script>
    <script src="jspsych-5.0/plugins/jspsych-binary-choice.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.10.3/jquery-ui.min.js"></script>
    <link href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.10.3/themes/black-tie/jquery-ui.min.css" rel="stylesheet" type="text/css"></link>
    <link href="jspsych-5.0/css/jspsych.css" rel="stylesheet" type="text/css"></link>
  </head>
  <body>
  </body>
  <script>

/* define welcome message block */
var welcome_block = {
    type: "text",
    text: function() {
      var msg = "<p>Welcome to the second section of the experiment.</p>";
      if (uni_from_task1) {
        /* show the carried-over UNI so a student can catch a wrong one before starting */
        msg += "<p>You are recorded as <strong>" + uni_code + "</strong>. If that is not " +
               "your UNI, please go back to Section 1 and start again.</p>";
      }
      return msg + "<p>Press any key to continue.</p>";
    }
};

/* insert UNI */
/* Task 1 hands the UNI over in the query string (../Task2/?uni=ab1234), so in the normal
   flow students never type it twice and the two data files are guaranteed to carry the
   same identifier. The prompt below is only a fallback for someone who opens this page
   directly; it applies the same normalization and validation as Task 1. */
var uni_is_valid = function(code) { return /^[a-z]{2,3}[0-9]{4}$/.test(code); };
var uni_from_url = jsPsych.data.getURLVariable('uni');
var uni_code = (typeof uni_from_url === 'string') ? uni_from_url.replace(/\s+/g, '').toLowerCase() : '';
var uni_from_task1 = uni_is_valid(uni_code);
if (!uni_from_task1) { uni_code = ''; }
var uni_attempts = 0;

var uni_trial = {
    type: "survey-text",
    questions: ["Enter your UNI (2 or 3 letters followed by 4 digits, for example ab1234) in the box below and press submit to begin the second task."],
    preamble: function() {
      if (uni_attempts === 0) { return ""; }
      return '<p style="color:#a00;"><strong>That does not look like a valid UNI.</strong> ' +
             'A UNI is 2 or 3 letters followed by 4 digits, for example ab1234. Please try again.</p>';
    },
    rows: [1],
    columns: [10],
    on_finish: function(trial_data){
      var responses = JSON.parse(trial_data.responses);
      uni_code = String(responses.Q0).replace(/\s+/g, '').toLowerCase();
      uni_attempts = uni_attempts + 1;
      jsPsych.data.addProperties({uni_code: uni_code});
    }
};

var uni_block = {
    timeline: [uni_trial],
    loop_function: function(){ return !uni_is_valid(uni_code); }
};

/* define instructions message block */
var instructions_block = {
    type: "text",
    text: "<p>In every trial of this task, two snack items will appear on the screen.</p>" +
        "<p>Your task is to indicate which of the two snack items you would rather have. " +
        "Press the Q key to choose the item on the left or the P key to choose the item on the right.</p></div>" +
        "<p>Press any key to begin.</p>",
        timing_post_trial: 2000
};

/* i is a counter and indicates current trial (starts at 1 and is updated after each choice) */
var i=1;
var next = function(){
    i = i+1;
}

/* sorted list of stimuli, nested cycle generates the list of simple combinations (pairs) */
var new_stimuli=[];
for (var i1 = 1; i1<=30; i1++){
  for (var i2 = i1+1; i2<=30; i2++){
    new_stimuli.push({stimuli: ["img/" + i1 + "_food.jpg","img/" + i2 + "_food.jpg"],data: {item1: i1, item2: i2}});
  }
}
/* the order of the list is randomized*/
var all_trials = jsPsych.randomization.repeat(new_stimuli,2);

/* randomize time after trial */
var post_trial_gap = function() {
    return Math.floor( Math.random() * 750 ) + 250;
}

/* choice block */
var test_block = {
  type: "binary-choice",
  choices: ['F'],
  prompt:"<p><center>Press Q key to choose the option on the left or P key to choose the option on the right.</center></p>",
  timing_response: 1500,
  timing_post_trial: post_trial_gap,
  on_finish: function(data){
    var frog = data.item1;      //they are called frog
    var frog2 = data.item2;     //because they can jump
    if(data.reverse == true){   //resort item1 and 2 if required
      jsPsych.data.addDataToLastTrial({item1: frog2}); //item1 = left
      jsPsych.data.addDataToLastTrial({item2: frog});  //item2 = right
     }
    var correct = true;
    jsPsych.data.addDataToLastTrial({correct: correct});
    var round = i;
    jsPsych.data.addDataToLastTrial({round: round}); //indicates current trial
    next();
  },
  timeline: all_trials
};

/* summary statistics */
function getSubjectData() {
      var trials = jsPsych.data.getTrialsOfType('binary-choice');
      var sum_rt = 0;
      for (var i = 0; i < trials.length; i++) {
            sum_rt += trials[i].rt;
          }
      return {
        rt: Math.floor(sum_rt / trials.length),
      }
}

/* debrief block statistics */
var debrief_block = {
      type: "text",
      text: function() {
        var subject_data = getSubjectData();
        return "<p>You completed the second task. Your average response time was <strong>" +
        subject_data.rt + " ms</strong>.</p><p>Press any key to finish the experiment "+
        "and download your data file.</p>";
       }
};

/* create experiment timeline array */
var timeline = [];
timeline.push(welcome_block);       // welcome message
if (uni_from_task1) {               // UNI arrived from Task 1 in the query string
  jsPsych.data.addProperties({uni_code: uni_code});
} else {
  timeline.push(uni_block);         // fallback: page opened directly, so ask for it
}
timeline.push(instructions_block);  // instructions
timeline.push(test_block);          // expriment
timeline.push(debrief_block);       // summary statistics

/* save data code snippet
function save_data(data){
     var data_table = "peacock"; // change this for different experiments
     $.ajax({
        type:'post',
        cache: false,
        url: 'savedata.php', // change this to point to your php file.
        data: {
            table: data_table,
            json: JSON.stringify(data),
        },
        success: function(output) { console.log(output); } // write the result to javascript console
     });
}*/
function saveData(filename, filedata){
   $.ajax({
      type:'post',
      cache: false,
      url: 'save_data.php', // this is the path to the above PHP script
      data: {filename: filename, filedata: filedata}
   });
}

/* start the experiment */
jsPsych.init({
timeline: timeline,
on_finish: function() {
    var display_element = jsPsych.getDisplayElement();

    /* =====================================================================
       TA: the submission details below are PLACEHOLDERS. Edit the text
       between the two SUBMISSION INSTRUCTIONS markers. It is ordinary HTML
       inside a JavaScript string, so keep the quoting style as it is: each
       line wrapped in single quotes and joined to the next one with a +.
       The bracketed ALL-CAPS items are the bits that need replacing.
       ===================================================================== */
    display_element.html(
      '<div class="center-content">' +
      '<h2>Experiment complete &mdash; thank you!</h2>' +
      '<p>You have now finished <strong>both sections</strong> of the experiment.</p>' +
      '<p>Your data file <strong>' + uni_code + '_part2.csv</strong> has been downloaded ' +
      'to your computer.</p>' +

      /* ---------------- SUBMISSION INSTRUCTIONS: edit below ---------------- */
      '<h3>Submitting your data</h3>' +
      '<p>You must upload <strong>both</strong> of your data files to Courseworks:</p>' +
      '<ul style="display:inline-block; text-align:left;">' +
      '<li><strong>' + uni_code + '_part1.csv</strong> &nbsp;(from Section 1)</li>' +
      '<li><strong>' + uni_code + '_part2.csv</strong> &nbsp;(from Section 2)</li>' +
      '</ul>' +
      '<p>Both files are in your browser&rsquo;s <strong>Downloads</strong> folder. ' +
      'Please do not rename them.</p>' +
      '<p>Upload them to the <strong>[ASSIGNMENT NAME]</strong> assignment on Courseworks ' +
      'by <strong>[DUE DATE]</strong>.</p>' +
      '<p>If you cannot find your Section 1 file, you will need to redo Section 1. ' +
      'Questions? Contact <strong>[TA NAME AND EMAIL]</strong>.</p>' +
      /* ---------------- SUBMISSION INSTRUCTIONS: edit above ---------------- */

      '<p style="color:#777; font-size:13px;">If your download did not start, ' +
      '<a href="#" id="download-again">click here to download your Section 2 data file</a>.</p>' +
      '</div>'
    );

    $('#download-again').click(function(e){
      e.preventDefault();
      $('#jspsych-download-as-text-link').remove();
      jsPsych.data.localSave(uni_code + '_part2.csv', 'csv');
    });

    /* Still POSTs to save_data.php. There is no PHP on a static host, so this request
       just fails silently; it is left in place for if a backend is added later. */
    saveData(uni_code + '.csv', jsPsych.data.dataAsCSV());

    /* Trigger the download LAST: localSave appends its hidden <a> into the display
       element, so the end screen has to exist first or it would be wiped away. */
    jsPsych.data.localSave(uni_code + '_part2.csv', 'csv');
}
});
  </script>
</html>
